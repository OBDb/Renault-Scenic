references:
  - "https://en.wikipedia.org/wiki/Renault_Sc%C3%A9nic"

generations:
  - name: "First Generation"
    start_year: 1996
    end_year: 2003
    description: "The Megane Scenic and, from 1999, Scenic: a compact MPV on the first Megane's platform, with petrol and diesel four-cylinder engines and a four-wheel-drive RX4."

  - name: "Second Generation"
    start_year: 2003
    end_year: 2009
    description: "A compact MPV and the seven-seat Grand Scenic on the second Megane's platform, with petrol and dCi diesel engines."

  - name: "Third Generation"
    start_year: 2009
    end_year: 2016
    description: "A compact MPV and Grand Scenic on the third Megane's platform, with TCe petrol and dCi diesel engines."

  - name: "Fourth Generation"
    start_year: 2016
    end_year: 2022
    description: "A compact MPV and Grand Scenic on the CMF-C/D platform shared with the fourth Megane, with TCe petrol and Blue dCi diesel engines and a 48 V mild hybrid diesel."

  - name: "Scenic E-Tech Electric"
    start_year: 2023
    end_year: null
    description: "A battery-electric crossover on the AmpR Medium (CMF-EV) platform shared with the Megane E-Tech Electric, with a wound-rotor front motor and 60 or 87 kWh batteries; production began in late 2023."
